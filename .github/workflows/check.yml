name: Check

# Compiles and tests without publishing anything.
#
# A push to main cuts a signed release that BrightMarket puts on the phone within minutes, so
# main is a bad place to find out something doesn't compile. Every other branch runs this
# instead: the same build, minus the signing checks and the release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      # The ranking in Scoring.kt is the only logic in this app, and getting it wrong is silent
      # on the phone — the icon opens something, just not Chats. So the tests are the check.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrightJump-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
